interface:
  display_name: "Paper Deep Reading"
  short_description: "Evidence-grounded paper reading and research judgment"
  default_prompt: "Use $paper-deep-reading to run its read-only dependency preflight without installing software, modifying credentials, uploading files, or enabling Zotero; report any downgrade, then create a Chinese view-report.md with standard validation and semantic-footnote-v1 external citations unless I narrow the scope, and assess originality, research-generative ideas, perspective shifts, and the necessity, sufficiency, and alternatives of central design choices when triggered."

policy:
  allow_implicit_invocation: true
