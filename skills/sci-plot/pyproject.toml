[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-plot"
version = "0.2.0"
description = "Safe, deterministic scientific plotting from versioned figure specifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "pillow>=10",
  "SciencePlots>=2.1,<3",
]

[project.optional-dependencies]
pubfig = ["pubfig>=0.3,<0.4"]
scienceplots = ["SciencePlots>=2.1,<3"]
stats = ["scipy>=1.11"]
dev = ["pytest>=8"]

[project.scripts]
sci-plot = "sci_plot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sci_plot = ["resources/*.toml"]
