  <path d="M 172 162 C 196 162, 196 97, 219 97" fill="none" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#arr-teal)" />
  <path d="M 172 194 C 194 194, 198 168, 219 168" fill="none" stroke="#6366f1" stroke-width="1.6" marker-end="url(#arr-indigo)" />
  <path d="M 172 226 C 196 226, 196 270, 219 270" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arr-blue)" />

  <line x1="472" y1="168" x2="499" y2="168" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)" />

  <line x1="346" y1="196" x2="346" y2="210" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 2.5" marker-end="url(#arr-slate)" />
  <text x="355" y="207" font-size="10.5" fill="#64748b">升级审查</text>

  <path d="M 702 97 C 724 97, 724 134, 745 134" fill="none" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#arr-teal)" />
  <path d="M 702 168 C 722 168, 724 162, 745 162" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3.5 3" marker-end="url(#arr-amber)" />
  <path d="M 702 270 C 724 270, 724 264, 745 264" fill="none" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#arr-teal)" />

  <!-- Col 1: Router -->
  <g filter="url(#soft-shadow)">
    <rect x="28" y="68" width="144" height="256" rx="14" fill="url(#g-neutral)" stroke="#cbd5e1" stroke-width="1.2" />
  </g>
  <rect x="42" y="82" width="52" height="20" rx="6" fill="#f1f5f9" />
  <text x="68" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">01 分流</text>
  <text x="42" y="128" font-size="15" font-weight="700" fill="#0f172a">先分轻重</text>

  <rect x="42" y="144" width="116" height="28" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="100" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">改动范围</text>

  <rect x="42" y="180" width="116" height="28" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="100" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">主张成熟度</text>

  <rect x="42" y="216" width="116" height="28" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="100" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">实质分歧</text>

  <line x1="42" y1="262" x2="158" y2="262" stroke="#e2e8f0" stroke-width="1" />
  <text x="100" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">不按字数定重轻</text>
  <text x="100" y="302" text-anchor="middle" font-size="11" fill="#64748b">轻任务零冗余提问</text>

  <!-- Col 2: Track 1 -->
  <g filter="url(#soft-shadow)">
    <rect x="222" y="68" width="480" height="58" rx="14" fill="url(#g-teal)" stroke="#5eead4" stroke-width="1.2" />
  </g>
  <rect x="236" y="85" width="24" height="24" rx="7" fill="#d1fae5" />
  <text x="248" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">1</text>
  <text x="272" y="94" font-size="14" font-weight="700" fill="#0f172a">轻量编辑</text>
  <text x="272" y="113" font-size="12" fill="#475569">润色 · 扩写 · 局部修复</text>
  <rect x="596" y="84" width="90" height="26" rx="13" fill="#d1fae5" />
  <text x="641" y="101" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">保原意直出</text>

  <!-- Col 2: Track 2 -->
  <g filter="url(#soft-shadow)">
    <rect x="222" y="140" width="250" height="56" rx="14" fill="url(#g-indigo)" stroke="#a5b4fc" stroke-width="1.2" />
