  <text x="149" y="35" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">V2.4</text>
  <text x="184" y="36" font-size="12" fill="#475569">按轻重分流 · 一次一题 · 隔离红蓝成稿</text>

  <g transform="translate(710, 26)">
