  <polygon points="522,158 528,164 522,170 516,164" fill="#b45309" />
  <text x="536" y="168" font-size="13.5" font-weight="700" fill="#b45309">一次一题</text>
  <text x="536" y="185" font-size="11.5" fill="#475569">只问关键取舍 · 跨宿主</text>

  <!-- Col 2: Track 3 -->
  <g filter="url(#soft-shadow)">
    <rect x="222" y="212" width="480" height="112" rx="14" fill="url(#g-neutral)" stroke="#cbd5e1" stroke-width="1.2" />
  </g>
  <rect x="236" y="222" width="22" height="20" rx="6" fill="#dbeafe" />
  <text x="247" y="236" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">3</text>
  <text x="266" y="236" font-size="13" font-weight="700" fill="#0f172a">独立审查</text>
  <text x="688" y="236" text-anchor="end" font-size="11" fill="#64748b">主线程中转 · 子代理互不直连</text>

  <line x1="336" y1="281" x2="348" y2="281" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr-slate)" />
  <line x1="452" y1="281" x2="464" y2="281" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr-slate)" />
  <line x1="568" y1="281" x2="580" y2="281" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)" />

  <rect x="234" y="250" width="102" height="62" rx="10" fill="url(#g-blue)" stroke="#3b82f6" stroke-width="1.35" stroke-dasharray="4 3" />
  <text x="285" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">蓝方立论</text>
  <text x="285" y="296" text-anchor="middle" font-size="11.5" fill="#475569">展开主张证据</text>

  <rect x="350" y="250" width="102" height="62" rx="10" fill="url(#g-rose)" stroke="#fb7185" stroke-width="1.35" stroke-dasharray="4 3" />
  <text x="401" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#be123c">红方挑错</text>
  <text x="401" y="296" text-anchor="middle" font-size="11.5" fill="#475569">审计事实反例</text>

  <rect x="466" y="250" width="102" height="62" rx="10" fill="url(#g-amber)" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="484,267 489,272 484,277 479,272" fill="#b45309" />
  <text x="495" y="276" font-size="13" font-weight="700" fill="#b45309">人工拍板</text>
  <text x="517" y="296" text-anchor="middle" font-size="11.5" fill="#475569">未批不成稿</text>

  <rect x="582" y="250" width="108" height="62" rx="10" fill="url(#g-teal)" stroke="#5eead4" stroke-width="1.35" stroke-dasharray="4 3" />
  <text x="636" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">隔离成稿</text>
  <text x="636" y="296" text-anchor="middle" font-size="11.5" fill="#475569">脱敏一次写完</text>

  <!-- Col 3: Delivery -->
  <text x="750" y="80" font-size="11.5" font-weight="700" fill="#475569">按体裁交付</text>
  <text x="892" y="80" text-anchor="end" font-size="11" fill="#64748b">少防御套话</text>

  <g filter="url(#soft-shadow)">
    <rect x="748" y="92" width="144" height="104" rx="14" fill="url(#g-neutral)" stroke="#cbd5e1" stroke-width="1.2" />
  </g>
  <text x="762" y="118" font-size="13.5" font-weight="700" fill="#0f172a">内部审阅稿</text>
  <text x="762" y="138" font-size="11.5" fill="#475569">讨论稿 · 草案</text>
  <rect x="762" y="156" width="116" height="26" rx="7" fill="#f1f5f9" />
  <text x="820" y="173" text-anchor="middle" font-size="11.5" fill="#475569">审计说明放文末</text>

  <g filter="url(#soft-shadow)">
    <rect x="748" y="208" width="144" height="116" rx="14" fill="url(#g-teal)" stroke="#5eead4" stroke-width="1.5" />
  </g>
  <rect x="762" y="220" width="52" height="19" rx="9.5" fill="#d1fae5" />
  <text x="788" y="233" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f766e">主交付</text>
  <text x="762" y="259" font-size="14" font-weight="700" fill="#0f172a">正式投稿稿</text>
  <text x="762" y="279" font-size="11.5" fill="#475569">论文 · 投稿 · 基金</text>
  <text x="762" y="304" font-size="11.5" font-weight="600" fill="#0f766e">限制入正文 · 零标签</text>
</svg>
