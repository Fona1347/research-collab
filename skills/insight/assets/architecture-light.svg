  <rect x="236" y="156" width="24" height="24" rx="7" fill="#e0e7ff" />
  <text x="248" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">2</text>
  <text x="272" y="165" font-size="14" font-weight="700" fill="#0f172a">共同立论</text>
  <text x="272" y="184" font-size="12" fill="#475569">直觉 + 文献 → 候选主张</text>

  <g filter="url(#soft-shadow)">
    <rect x="502" y="140" width="200" height="56" rx="14" fill="url(#g-amber)" stroke="#f59e0b" stroke-width="1.3" />
