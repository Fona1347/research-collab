    <polygon points="124,0 129,5 124,10 119,5" fill="#b45309" />
    <text x="135" y="9" font-size="11" font-weight="600" fill="#b45309">人工拍板</text>
  </g>

  <line x1="28" y1="52" x2="892" y2="52" stroke="#e2e8f0" stroke-width="1" />

