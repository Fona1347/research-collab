interface:
  display_name: "Markdown Academic Citation (md-citation)"
  short_description: "Markdown 学术引用格式化：GFM 跳转脚注 [^1]（兼容 Antigravity/Typora/Obsidian/GitHub，支持 B–F 兼容模板）、7 种学术格式可配默认、末尾可点超链接与确定性校验"
  default_prompt: "使用 md-citation 将文档或回答中的文献引用统一规范为按首次出现顺序编号的 GFM 跳转脚注 [^1]（或指定兼容模板 B–F）+ 用户默认学术格式（内置默认 IEEE，支持自由切换与持久化设置），并在每条参考文献末尾附带可点击的原文超链接，最后通过确定性脚本校验。"
