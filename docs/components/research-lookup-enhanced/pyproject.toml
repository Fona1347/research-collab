[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-lookup-enhanced-skill"
version = "0.3.0"
description = "Maintainable source project for the research-lookup-enhanced Codex Skill"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5",
]

[project.optional-dependencies]
html = [
  "beautifulsoup4>=4.12",
  "readability-lxml>=0.8.1",
  "trafilatura>=2",
]
markitdown = [
  "markitdown[pdf]>=0.1",
]
# Reserved boundary: model and framework dependencies remain user-approved and
# are deliberately not installed by this project stage.
semantic = []

[tool.setuptools]
packages = []
